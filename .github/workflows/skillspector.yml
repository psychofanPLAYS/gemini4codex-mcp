name: NVIDIA SkillSpector Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'plugin/skills/**/*.md'
      - '.codex-plugin/plugin.json'

jobs:
  analyze:
    name: SkillSpector Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run NVIDIA SkillSpector
      uses: nvidia/skillspector-action@v1
      with:
        path: './plugin/skills'
        fail-on-severe: true
        llm-evaluation: true

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: skillspector-results.sarif
        category: skillspector-ai-security
